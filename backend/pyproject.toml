[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sisacare-api"
version = "0.1.0"
description = "FastAPI backend for SisaCare.AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "google-auth>=2.40,<3.0",
    "pillow>=12,<13",
    "pydantic-settings>=2.7,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "reportlab>=4.2,<5.0",
    "psycopg[binary]>=3.2,<4.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
legacy-ai = ["ultralytics>=8.4,<9.0"]
dev = [
    "pytest>=8.3,<10.0",
    "pypdf>=6,<7",
]
analytics = ["pandas>=2.2,<3.0", "scikit-learn>=1.5,<2.0", "joblib>=1.4,<2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["storage*", "datasets*"]
